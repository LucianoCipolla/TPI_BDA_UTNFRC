server:
  port: 8081

spring:
  main:
    banner-mode: off
  application:
    name: ms-espacios
  datasource:
    url: jdbc:h2:file:./data/espacios     # H2 embebida en archivo, como el ejemplo de la cátedra
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  pattern:
    # Corto y legible: hora, nivel y clase (sin fecha, PID ni thread). docker compose ya antepone el servicio
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p) %clr(%-28.28logger{0}){cyan} %m%n"
  level:
    root: WARN                                       # Spring, Tomcat, Hibernate: solo avisos y errores
    org.springdoc: ERROR                             # sus avisos de "habilitado en producción" no aplican
    ar.edu.utn.frc.bda.campus: ${LOG_LEVEL:INFO}     # nuestro código; DEBUG para ver más detalle

springdoc:
  swagger-ui:
    path: /swagger-ui.html

campus:
  clima:
    url: ${OPEN_METEO_URL:https://api.open-meteo.com}
    umbral-lluvia: ${CLIMA_UMBRAL:60}     # %