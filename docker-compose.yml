# docker-compose.yml: todo el sistema. Antes: sh build.sh. Después: docker compose up --build
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8080"

  ms-espacios:
    build: ./ms-espacios            # sin ports: solo accesible por la red interna
    environment:
      TZ: America/Argentina/Cordoba   # las imágenes corren en UTC (T68)
      SPRING_OUTPUT_ANSI_ENABLED: always   # colores en los logs (sin terminal, Spring los apaga)

  ms-reservas:
    build: ./ms-reservas
    environment:
      TZ: America/Argentina/Cordoba
      SPRING_OUTPUT_ANSI_ENABLED: always
      MS_ESPACIOS_URL: http://ms-espacios:8081
    depends_on: [ms-espacios]

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"                 # el único punto de entrada
    environment:
      TZ: America/Argentina/Cordoba
      SPRING_OUTPUT_ANSI_ENABLED: always
      MS_ESPACIOS_URL: http://ms-espacios:8081
      MS_RESERVAS_URL: http://ms-reservas:8082
      JWK_SET_URI: http://keycloak:8080/realms/campus/protocol/openid-connect/certs
    depends_on: [keycloak, ms-espacios, ms-reservas]